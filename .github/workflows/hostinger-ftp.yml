name: Build and try Hostinger static frontend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.mjs'
      - '.github/workflows/hostinger-ftp.yml'

permissions:
  contents: read

jobs:
  static-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER || 'academy.agroconnectcm.com' }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'u615884098.academy.agroconnectcm.com' }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://agroconnectacademy.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure static export in CI workspace only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'next.config.mjs';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('const nextConfig = {', "const nextConfig = {\n  output: 'export',");
          s = s.replace(/  async headers\(\) \{[\s\S]*?\n  \},\n/, '');
          s = s.replace(/  outputFileTracingIncludes: \{[^\n]*\},\n/, '');
          fs.writeFileSync(p, s);
          NODE
          # Next.js static export cannot include server API route handlers.
          # Preserve them outside the build workspace; this does not change the repo.
          if [ -d src/app/api ]; then mv src/app/api /tmp/agroconnect-academy-api-routes; fi
          if [ -d app/api ]; then mv app/api /tmp/agroconnect-academy-root-api-routes; fi

      - name: Configure public API base URL
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "NEXT_PUBLIC_API_URL is not configured."
            exit 1
          fi
          printf 'NEXT_PUBLIC_API_URL=%s\n' "$NEXT_PUBLIC_API_URL" > .env.production

      - name: Compile static site
        run: npm run build

      - name: Upload compiled output as a diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: agroconnect-academy-static-export
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to Hostinger public_html via FTP
        if: ${{ success() && env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: out/
          server-dir: public_html/
          dangerous-clean-slate: false

      - name: Explain missing FTP credentials
        if: ${{ success() && (env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == '') }}
        run: |
          echo "Static export succeeded, but FTP upload was skipped. Add FTP_SERVER and FTP_USERNAME repository secrets; FTP_PASSWORD is already configured."
